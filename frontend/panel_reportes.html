<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLD Traffic Hub - Panel Principal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-body">

    <!-- BANNER SUPERIOR -->
    <header class="top-banner">
        <div class="banner-logo">NLD Traffic Hub</div>
        <a href="cuenta.html" class="banner-user-btn" id="nav-user-btn">Mi Cuenta</a>
    </header>

    <main class="hub-container">
        
        <!-- ENCABEZADO Y TITULO -->
        <div class="news-card">
            <h1>NLD Traffic Hub</h1>
            <h3>Avisos y Noticias</h3>
            <p>Monnitoreo de incidentes urbanos y reportes ciudadanos en tiempo real</p>
        </div>

        <!-- BARRA DE BÚSQUEDA Y FILTROS -->
        <div class="search-and-filters">
            <!-- Barra de búsqueda por ubicación o calle -->
            <div class="search-box">
                <input type="text" id="input-busqueda" placeholder="Buscar por colonia, calle o lugar...">
            </div>

            <!-- Botones de categorías solicitadas por el cliente -->
            <div class="filters-wrapper">
                <button class="btn-filter cat-todos active" data-cat="Todos">Todos</button>
                <button class="btn-filter cat-accidente" data-cat="Accidente">Accidente</button>
                <button class="btn-filter cat-trafico" data-cat="Trafico">Tráfico</button>
                <button class="btn-filter cat-cerrada" data-cat="Calle cerrada">Calle cerrada</button>
                <button class="btn-filter cat-inundacion" data-cat="Inundacion">Inundación</button>
                <button class="btn-filter cat-obra" data-cat="Obra vial">Obra vial</button>
            </div>
        </div>

        <!-- CONTENEDOR DE REPORTES (FEED DE TARJETAS) -->
        <div class="reports-grid" id="reports-container">
            <!-- Aquí se renderizarán dinámicamente las tarjetas creadas -->
            <p class="loading-text">Cargando reportes viales en tiempo real...</p>
        </div>

    </main>

    <!-- BOTÓN FLOTANTE PARA CREAR REPORTE -->
    <button class="btn-floating-create" id="btn-abrir-modal">
        ➕ Crear reporte
    </button>

    <!-- MODAL EMERGENTE PARA NUEVO REPORTE -->
    <div class="modal-overlay" id="modal-reporte" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2> Reportar incidente</h2>
                <button class="btn-close-modal" id="btn-cerrar-modal">&times;</button>
            </div>
            
            <form id="form-nuevo-reporte">
                <div class="form-grid-layout">

                    <!-- Lado IZQUIERDO -->
                    <div class="form-col-left">
                        <div class="form-group">
                            <label>¿Qué está pasando?</label>
                            <div class="category-selector">
                                <label class="cat-radio"><input type="radio" name="categoria" value="Accidente" required>Accidente</label>
                                <label class="cat-radio"><input type="radio" name="categoria" value="Tráfico">Tráfico</label>
                                <label class="cat-radio"><input type="radio" name="categoria" value="Calle cerrada">Calle cerrada</label>
                                <label class="cat-radio"><input type="radio" name="categoria" value="Inundación">Inundación</label>
                                <label class="cat-radio"><input type="radio" name="categoria" value="Obra vial">Obra vial</label>
                            </div>
                        </div>

                        <!-- Ubicación -->
                        <div class="form-group" style="margin-top: 15px;">
                            <label for="rep-ubicacion">Ubicación exacta</label>
                            <input type="text" id="rep-ubicacion" placeholder="Ej: Av. Reforma" required>
                        </div>
                    </div>

                    <!-- Lado DERECHO-->
                    <div class="form-col-right">

                        <div class="form-group">
                            <label for="rep-descripcion">Detalles / Descripción</label>
                            <textarea id="rep-descripcion" placeholder="Da más contexto (carriles bloqueados, tiempo de espera, etc.)" required></textarea>
                        </div>

                        <!-- Evidencia fotografica (URL/Archivo) -->
                        <div class="form-group" style="margin-top: 10px;">
                            <label>Evidencia Fotografica</label>
                            <div class="img-input-options">
                                <button type="button" class="btn-toggle-img active" id="btn-mode-file">
                                    Subir Archivo
                                </button>
                                <button type="button" class="btn-toggle-img" id="btn-mode-url">
                                    Usar Enlace
                                </button>
                            </div>
                            <!--Archivo local -->
                            <input type="file" id="rep-imagen-file" accept="image/*">
                            <!--URL -->
                            <input type="url" id="rep-imagen-url" placeholder="https://ejemplo.com/foto.jpg" style="display: none;">
                        </div>
                    </div>

                </div>
                    
                    

                <!-- Botones de Acción -->
                <div class="modal-actions" style="margin-top: 20px;">
                    <button type="button" class="btn-cancel" id="btn-cancelar-modal">Cancelar</button>
                    <button type="submit" class="btn-submit-report">Publicar reporte</button>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="panel.js"></script>
</body>
</html>
