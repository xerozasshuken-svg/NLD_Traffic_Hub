<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLD Traffic Hub - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Inicio sesión</h2>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-auth-submit">Iniciar Sesión</button>
            </form>

            <div class="auth-extra-links">
                <a href="registro.html" class="btn-link-out">Registrarse</a>
                <a href="comienzo.html" class="btn-link-out">Inicio</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
