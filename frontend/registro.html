<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Viales - Registrarse</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            
            <form id="form-registro">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="correo-reg">Correo Electrónico</label>
                    <input type="email" id="correo-reg" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password-reg">Contraseña</label>
                    <input type="password" id="password-reg" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-auth-submit">Registrarse</button>
            </form>

            <div class="auth-extra-links">
                <a href="login.html" class="btn-link-out">Ya tengo cuenta</a>
                <a href="comienzo.html" class="btn-link-out">Inicio</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
